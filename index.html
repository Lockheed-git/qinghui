<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="用 Scenimefy 在浏览器里把照片重绘成动画背景。">
    <title>晴绘 · Scenimefy 4K</title>
    <link rel="stylesheet" href="./style.css">
    <script defer src="./app.js"></script>
</head>
<body>
    <header class="topbar">
        <div class="shell topbar-inner">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 32 32" fill="none"><circle cx="22.5" cy="9.5" r="3.5" fill="#f6c68d"/><path d="M5 23.5 13.7 12l5.2 7 3-4 5.1 8.5H5Z" fill="#fff"/><path d="m9 23.5 4.6-6.3 2.1 2.8 2.2-1.4 3.7 4.9H9Z" fill="#b9dfcf"/></svg>
                </span>
                <span class="brand-name">晴绘</span>
                <span class="brand-divider"></span>
                <span class="brand-model">Scenimefy 4K</span>
            </div>
            <span class="device" id="device" role="status">
                <span class="device-dot" aria-hidden="true"></span>
                <span id="device-label">浏览器重绘</span>
            </span>
        </div>
    </header>

    <main class="shell">
        <div class="intro">
            <h1>照片重绘</h1>
            <p>把照片变成动画背景，保留原来的构图和画幅。</p>
        </div>

        <div class="workspace">
            <section class="card controls" aria-labelledby="upload-title">
                <h2 id="upload-title">导入照片</h2>
                <button class="dropzone" id="dropzone" type="button">
                    <span class="upload-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 15V4m-4 4 4-4 4 4M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg>
                    </span>
                    <strong id="drop-label">拖入图片</strong>
                    <span class="choose" id="choose-label">或点击选择文件</span>
                    <span class="formats">JPG、PNG、WebP · 最大 32 MB</span>
                </button>
                <input id="file" type="file" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp" hidden>
                <div class="selected-file" id="selected-file" hidden>
                    <span class="file-name" id="file-name"></span>
                    <span class="file-size" id="file-size"></span>
                </div>

                <fieldset class="mode">
                    <legend>处理模式</legend>
                    <div class="mode-options">
                        <label><input type="radio" name="mode" value="color" checked><span>原图调色</span></label>
                        <label><input type="radio" name="mode" value="native"><span>逐块重绘</span></label>
                        <label><input type="radio" name="mode" value="preview"><span>快速预览</span></label>
                    </div>
                    <p id="mode-hint">从重绘缩略图提取颜色，应用到原图。</p>
                </fieldset>

                <button class="run" id="run" type="button" hidden>重新重绘</button>
                <div class="progress" id="progress" role="status" hidden>
                    <span class="spinner" aria-hidden="true"></span>
                    <span id="progress-label">正在重绘</span>
                </div>
                <progress id="tile-progress" aria-label="重绘进度" hidden></progress>
                <button class="cancel" id="cancel" type="button" hidden>取消</button>
                <p class="error" id="error" role="alert" hidden></p>

                <div class="privacy">
                    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" aria-hidden="true"><rect x="4.5" y="8.5" width="11" height="8" rx="2"/><path d="M7 8.5v-2a3 3 0 0 1 6 0v2M10 11.8v1.7"/></svg>
                    <span>照片只在当前浏览器处理</span>
                </div>
                <p class="model-note">首次生成需下载约 75 MB 模型和运行时。</p>
            </section>

            <section class="card preview" aria-labelledby="preview-title">
                <div class="preview-head">
                    <div>
                        <h2 id="preview-title">效果预览</h2>
                        <p class="preview-meta" id="preview-meta">示例 · 山间湖泊</p>
                    </div>
                    <a class="download" href="./mountain-repaint.png" id="download" download="山间湖泊-晴绘.png">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M12 4v12m-4-4 4 4 4-4M5 16v3a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3"/></svg>
                        <span>下载 PNG</span>
                    </a>
                </div>
                <div class="viewport" id="viewport">
                    <div class="frame" id="frame" data-state="compare">
                        <img class="repaint-image" id="after" src="./mountain-repaint.png" alt="重绘后的图像">
                        <img class="source-image" id="before" src="./mountain-original.jpg" alt="原始照片">
                        <div class="labels" aria-hidden="true"><span>原图</span><span id="after-label">重绘</span></div>
                        <div class="divider" aria-hidden="true">
                            <span class="handle">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m8 8-4 4 4 4m8-8 4 4-4 4"/></svg>
                            </span>
                        </div>
                        <input class="compare-slider" id="compare" type="range" min="0" max="100" value="50" aria-label="调整原图和重绘结果的分界线">
                    </div>
                </div>
                <div class="preview-foot">
                    <div class="examples">
                        <span class="examples-title">试试看</span>
                        <div class="example-list">
                            <button class="example" type="button" data-example="mountain" aria-pressed="true">
                                <img src="./mountain-original.jpg" alt=""><span>山间湖泊</span>
                            </button>
                            <button class="example" type="button" data-example="lake" aria-pressed="false">
                                <img src="./lake-original.jpg" alt=""><span>日光湖面</span>
                            </button>
                        </div>
                    </div>
                    <span class="compare-hint" id="compare-hint">拖动分界线对比</span>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
